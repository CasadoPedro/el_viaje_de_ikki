<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuento AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/cuento.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">

  <!-- Versiones correctas -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <!-- Indicador del equipo y posición -->
  <div class="turnoActual">
    TURNO: --
  </div>

  <!-- Scanning message -->
  <div id="scanningMessage" class="scanning-overlay">
    <div class="scanning-content">
      <h2>Escanea la carta de cuento</h2>
      <div class="scanning-animation"></div>
    </div>
  </div>

  <!-- Instruction message (hidden initially) -->
  <div id="instructionMessage" class="instruction-overlay" style="display: none;">
    <p>Elige una opción y toca la pantalla para seleccionarla</p>
  </div>

  <!-- Intro -->
  <div id="intro">
    <h1>CAISTE EN UN CASILLERO DE CUENTO</h1>
    <p>LEER EL CUENTO: <strong>LA CASA DEL BOSQUE OSCURO</strong></p>
    <button id="btnIntroContinuar">CONTINUAR</button>
  </div>

  <!-- Escena AR (oculta al inicio) -->
  <a-scene
    id="escenaAR"
    mindar-image="imageTargetSrc: ./ra/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable"
  >
    <!-- Target único -->
    <a-assets>
      <!-- Modelo -->
      <img id="card1" src="./visualAssets/cuentos/cuentoOP1.png"/>
      <img id="card2" src="./visualAssets/cuentos/cuentoOP2.png"/>
      <img id="card3" src="./visualAssets/cuentos/cuentoOP3.png"/>
      <!-- Modelo -->
      <a-asset-item id="ikki-obj" src="./ra/ikki 020001.obj"></a-asset-item>
      <a-asset-item id="ikki-mtl" src="./ra/ikki 020001.mtl"></a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: ${customFields.libVersion}; objects: .clickable"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Cards positioned with reduced spacing -->
      <a-plane id="card1-plane" src="#card1" position="0 0.50 0.1" height="0.36" width="0.64" rotation="0 0 0" class="clickable" data-card="1"></a-plane>
      <a-plane id="card2-plane" src="#card2" position="0 0 0.1" height="0.36" width="0.64" rotation="0 0 0" class="clickable" data-card="2"></a-plane>
      <a-plane id="card3-plane" src="#card3" position="0 -0.50 0.1" height="0.36" width="0.64" rotation="0 0 0" class="clickable" data-card="3"></a-plane>
      
      <!-- Text with grey backgrounds positioned further below each card -->
      <a-plane id="text1-bg" color="grey" opacity="0.8" position="0 0.25 0.10" height="0.08" width="0.55" rotation="0 0 0"></a-plane>
      <a-text value="Seguir a la figura" position="0 0.25 0.11" align="center" width="0.5" color="#000000" font="dejavu"></a-text>
      
      <a-plane id="text2-bg" color="grey" opacity="0.8" position="0 -0.25 0.10" height="0.08" width="0.55" rotation="0 0 0"></a-plane>
      <a-text value="Salir silenciosamente de la casa" position="0 -0.25 0.11" align="center" width="0.5" color="#000000" font="dejavu"></a-text>
      
      <a-plane id="text3-bg" color="grey" opacity="0.8" position="0 -0.75 0.10" height="0.08" width="0.55" rotation="0 0 0"></a-plane>
      <a-text value="Hablar con la figura" position="0 -0.75 0.11" align="center" width="0.5" color="#000000" font="dejavu"></a-text>
    </a-entity>
  </a-scene>

  <script type="module" src="./js/musica.js"></script>
  <script type="module" src="./js/cuento.js"></script>
</body>
</html>
