<!doctype html>
<html lang="es">
  <head>
    <title>Ruleta</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/ruleta.css" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap");
    </style>
  </head>

  <body>
    <div id="spin_the_wheel">
      <canvas id="wheel" width="800" height="800"></canvas>
      <div id="spin"><span id="spinText">GIRAR</span></div>
    </div>

    <button id="btn-adivinar">Intentar adivinar la frase</button>
    <div class="turnoActual">TURNO: --</div>

    <!-- Modal Recompensa -->
    <div id="modalRecompensa" class="modal">
      <div class="modal-contenido">
        <h2>¡RECOMPENSA!</h2>
        <h3>PASASTE POR UN CASILLERO DE REGALO</h3>
        <p id="jeroglificosGanados" class="jeroglificos-ganados"></p>
        <p id="fraseAnimada" class="frase-recompensa"></p>
        <button id="btnRecompensaContinuar">CONTINUAR</button>
      </div>
    </div>    

    <!-- Modal de adivinar frase -->
    <div id="modal-adivinar-frase" class="modal">
      <div class="modal-contenido">
        <h2>Intentar Adivinar la Frase</h2>
        <p><span id="equipo-nombre"></span>, ingrese su intento:</p>
        <input id="input-frase" type="text" class="input-frase" placeholder="Escribe tu frase aquí..." />
        <div class="modal-buttons">
          <button id="btn-confirmar-frase">CONFIRMAR</button>
          <button id="btn-cancelar-frase">CANCELAR</button>
        </div>
      </div>
    </div>

    <!-- Modal Frase Adivinada -->
    <div id="modal-frase-adivinada" class="modal">
      <div class="modal-contenido">
        <h2 id="tituloFelicidades"></h2>
        <p id="parrafoFelicidades"></p>
        <button id="btn-frase-adivinada-continuar">CONTINUAR</button>
      </div>
    </div>

    <!-- Modal Fin del Juego -->
    <div id="modal-final-juego" class="modal">
      <div class="modal-contenido">
        <h2>¡FELICIDADES A TODOS LOS EQUIPOS!<br>HAN COMPLETADO EL CAMINO HASTA EL CORAZÓN DE IKKI!</h2>
        <p>¡CONTINÚEN COMPARTIENDO SU APRENDIZAJE CON AMOR!</p>
        <button id="btn-final-juego">FINALIZAR JUEGO</button>
      </div>
    </div>

    <!-- Modal Avance -->
    <div id="modal-avance" class="modal">
      <div class="modal-contenido">
        <p id="texto-avance"></p>
        <button id="btn-continuar">CONTINUAR</button>
      </div>
    </div>
    <!-- JS separado -->
    <script type="module" src="./js/musica.js"></script>
    <script type="module" src="./js/juegoRuleta.js"></script>
  </body>
</html>
